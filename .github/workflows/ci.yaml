name: BookMyHome_Ci

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "bookmyhome"
  GITHUB_ACTOR: "nicolai-madsen"

jobs:
  Build-and-Deploy-CiCd:
    name: Build and Deploy BookMyHome
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    steps: 
      - name: Get Code
        uses: actions/checkout@v7

      - name: Log into registry ${{env.REGISTRY}}
        uses: docker/login-action@v4
        with:
            registry: ${{env.REGISTRY}}
            username: ${{env.GITHUB_ACTOR}}
            password: ${{secrets.GITHUB_TOKEN}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with: 
          context: src/BookMyHome
          push: true
          tags: ${{env.REGISTRY}}/${{env.GITHUB_ACTOR}}/${{env.IMAGE_NAME}}:latest
