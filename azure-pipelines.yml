# BookMyHome - CI pipeline
# Kommer til at fejle hver gang, så længe der ikke er noget kode heri.
# Added it because I wanted to, sue me

trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Installer .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - script: dotnet restore
    displayName: 'Restore NuGet-pakker'

  - script: dotnet build --configuration $(buildConfiguration) --no-restore
    displayName: 'Build'

  - script: >
      dotnet test
      --configuration $(buildConfiguration)
      --no-build
      --logger trx
      --results-directory $(Agent.TempDirectory)
    displayName: 'Kør unit tests'

  - task: PublishTestResults@2
    displayName: 'Publicér testresultater'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)'
      failTaskOnFailedTests: true
